name: Rescue fund nightly allocation
on:
  schedule:
    - cron: '0 17 * * *' # 00:00 Asia/Ho_Chi_Minh; GitHub may start scheduled jobs late.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rescue-fund-nightly
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run authenticated reconciliation
        env:
          BACKEND_URL: ${{ vars.RENDER_BACKEND_URL }}
          WORKER_SECRET: ${{ secrets.NOTIFICATION_WORKER_SECRET }}
        shell: python
        run: |
          import os, time, urllib.request, urllib.error
          base = os.environ.get('BACKEND_URL', '').rstrip('/')
          secret = os.environ.get('WORKER_SECRET', '')
          if not base.startswith('https://') or len(secret) < 32:
              print('::notice::Fund scheduler is not configured. Set RENDER_BACKEND_URL variable and NOTIFICATION_WORKER_SECRET secret.')
              raise SystemExit(0)
          for attempt in range(3):
              request = urllib.request.Request(base + '/internal/notifications/run', data=b'{}', method='POST',
                  headers={'Content-Type': 'application/json', 'X-Worker-Secret': secret})
              try:
                  with urllib.request.urlopen(request, timeout=90) as result:
                      if result.status == 200:
                          print('Reconciliation completed; only active/configured funds can allocate.')
                          break
              except (urllib.error.URLError, TimeoutError):
                  if attempt == 2:
                      raise RuntimeError('Backend reconciliation unavailable; inspect Render logs without exposing worker credentials.') from None
                  time.sleep(30)
