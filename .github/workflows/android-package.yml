name: Android package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android API 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-37"

      - name: Prepare Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "rescuefarm-ci-placeholder",
              "storage_bucket": "rescuefarm-ci-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": {"package_name": "com.example.nhom_7_mobileapp"}
              },
              "api_key": [{"current_key": "ci-placeholder-api-key"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }]
          }
          JSON
            echo 'Using a temporary Firebase config for pull-request compilation only.'
          else
            echo '::error::Set the GOOGLE_SERVICES_JSON Actions secret to build a usable APK.'
            exit 1
          fi

      - name: Build debug APK
        env:
          RENDER_BACKEND_URL: ${{ vars.RENDER_BACKEND_URL }}
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_SIGNING_URL: ${{ vars.CLOUDINARY_SIGNING_URL }}
        shell: bash
        run: |
          ./gradlew --no-daemon :app:assembleDebug \
            "-PRENDER_BACKEND_URL=$RENDER_BACKEND_URL" \
            "-PCLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME" \
            "-PCLOUDINARY_SIGNING_URL=$CLOUDINARY_SIGNING_URL"

      - name: Stage package and checksum
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ -z "$VERSION_NAME" ]]; then
            echo '::error::Could not read versionName from app/build.gradle.kts.'
            exit 1
          fi
          mkdir -p Packages
          APK="Packages/RescueFarm-${VERSION_NAME}-${GITHUB_SHA:0:7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "Package staged at $APK"

      - name: Upload Packages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: Packages
          path: Packages/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged APK release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download Packages artifact
        uses: actions/download-artifact@v7
        with:
          name: Packages
          path: Packages/

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "RescueFarm $TAG" --generate-notes
          fi
          gh release upload "$TAG" Packages/*.apk Packages/*.sha256 --clobber
