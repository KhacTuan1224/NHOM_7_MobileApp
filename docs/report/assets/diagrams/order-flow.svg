<text x="1060.0" y="621.5" font-family="Arial" font-size="23" font-weight="normal" text-anchor="middle" fill="#172b31">Hoàn tất → chốt kho</text>
<text x="1060.0" y="652.5" font-family="Arial" font-size="23" font-weight="normal" text-anchor="middle" fill="#172b31">Hủy / quá hạn → hoàn giữ</text>
<text x="1060.0" y="683.5" font-family="Arial" font-size="23" font-weight="normal" text-anchor="middle" fill="#172b31">giữ lịch sử đơn</text>
<text x="660.0" y="810" font-family="Arial" font-size="20" font-weight="normal" text-anchor="middle" fill="#172b31">Client không tự đánh dấu đã nhận tiền. Webhook retry không tạo thêm khoản thu.</text>
<text x="660.0" y="838" font-family="Arial" font-size="20" font-weight="normal" text-anchor="middle" fill="#172b31">Đơn giao nhận và trạng thái thanh toán là hai chiều trạng thái cần đối chiếu.</text>
