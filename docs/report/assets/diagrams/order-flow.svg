<text x="1060.0" y="172.0" font-family="Arial" font-size="23" font-weight="normal" text-anchor="middle" fill="#172b31">Backend quote / checkout</text>
<text x="1060.0" y="203.0" font-family="Arial" font-size="23" font-weight="normal" text-anchor="middle" fill="#172b31">kiểm tra lại giá, quyền, tồn</text>
