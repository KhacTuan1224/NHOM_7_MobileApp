<text x="1100" y="836.0" font-family="Arial" font-size="25" font-weight="400" text-anchor="middle" fill="#e6f2e5">Sàn nông sản giải cứu</text>
<text x="1100" y="879.0" font-family="Arial" font-size="25" font-weight="400" text-anchor="middle" fill="#e6f2e5">Kết nối cung và cầu</text>
<text x="1100" y="1379.4" font-family="Arial" font-size="30" font-weight="700" text-anchor="middle" fill="#19372d">Nguồn hàng cần tiêu thụ  →  Giao dịch có kiểm soát  →  Người mua phù hợp</text>
