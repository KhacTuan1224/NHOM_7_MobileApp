<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1440" viewBox="0 0 2200 1440"><rect width="100%" height="100%" fill="white"/>
<text x="70" y="59.120000000000005" font-family="Arial" font-size="24" font-weight="700" text-anchor="start" fill="#2d704b">RESCUEFARM  /  GIẢI PHÁP</text>
<text x="70" y="127.24000000000001" font-family="Arial" font-size="48" font-weight="700" text-anchor="start" fill="#19372d">Kết nối người bán và người mua</text>
<text x="70" y="177.64" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#65756e">Sơ đồ tư duy về giải pháp thương mại điện tử giải cứu nông sản</text>
<path d="M900 780 C810.0 780 810.0 393 720 393" fill="none" stroke="#2d704b" stroke-width="5"/>
<path d="M900 780 C810.0 780 810.0 773 720 773" fill="none" stroke="#a46b20" stroke-width="5"/>
<path d="M900 780 C810.0 780 810.0 1153 720 1153" fill="none" stroke="#526d95" stroke-width="5"/>
<path d="M1300 780 C1390.0 780 1390.0 393 1480 393" fill="none" stroke="#2d704b" stroke-width="5"/>
<path d="M1300 780 C1390.0 780 1390.0 773 1480 773" fill="none" stroke="#2c7882" stroke-width="5"/>
<path d="M1300 780 C1390.0 780 1390.0 1153 1480 1153" fill="none" stroke="#8a6657" stroke-width="5"/>
<rect x="70" y="260" width="650" height="266" rx="22" fill="#edf5ef" stroke="#2d704b" stroke-width="2"/>
<text x="100" y="307.12" font-family="Arial" font-size="24" font-weight="700" text-anchor="start" fill="#2d704b">01</text>
<text x="152" y="312.8" font-family="Arial" font-size="35" font-weight="700" text-anchor="start" fill="#19372d">Người bán</text>
<text x="102" y="384.64" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#42524c">•  Đăng sản phẩm và quản lý từng lô</text>
<text x="102" y="430.64" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#42524c">•  Cập nhật giá, tồn kho và hạn sử dụng</text>
<text x="102" y="476.64" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#42524c">•  Tổ chức chiến dịch giải cứu</text>
<rect x="70" y="640" width="650" height="266" rx="22" fill="#fcf5e8" stroke="#a46b20" stroke-width="2"/>
<text x="100" y="687.12" font-family="Arial" font-size="24" font-weight="700" text-anchor="start" fill="#a46b20">02</text>
<text x="152" y="692.8" font-family="Arial" font-size="35" font-weight="700" text-anchor="start" fill="#19372d">Thông tin minh bạch</text>
<text x="102" y="764.64" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#42524c">•  Ảnh, mô tả và nguồn gốc sản phẩm</text>
<text x="102" y="810.64" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#42524c">•  Địa điểm nhận và thời gian chiến dịch</text>
<text x="102" y="856.64" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#42524c">•  Phân biệt hàng còn bán và hàng đang giữ</text>
<rect x="70" y="1020" width="650" height="266" rx="22" fill="#eff3f9" stroke="#526d95" stroke-width="2"/>
<text x="100" y="1067.12" font-family="Arial" font-size="24" font-weight="700" text-anchor="start" fill="#526d95">03</text>
<text x="152" y="1072.8" font-family="Arial" font-size="35" font-weight="700" text-anchor="start" fill="#19372d">Vận hành tin cậy</text>
<text x="102" y="1144.64" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#42524c">•  Admin duyệt Seller và nội dung</text>
<text x="102" y="1190.64" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#42524c">•  Kiểm tra vai trò, quyền sở hữu dữ liệu</text>
<text x="102" y="1236.64" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#42524c">•  Tiếp nhận báo cáo và xử lý vi phạm</text>
<rect x="1480" y="260" width="650" height="266" rx="22" fill="#edf5ef" stroke="#2d704b" stroke-width="2"/>
<text x="1510" y="307.12" font-family="Arial" font-size="24" font-weight="700" text-anchor="start" fill="#2d704b">04</text>
<text x="1562" y="312.8" font-family="Arial" font-size="35" font-weight="700" text-anchor="start" fill="#19372d">Người mua</text>
<text x="1512" y="384.64" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#42524c">•  Khám phá, tìm kiếm và lọc nông sản</text>
<text x="1512" y="430.64" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#42524c">•  Chọn lô, số lượng và thêm vào giỏ</text>
<text x="1512" y="476.64" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#42524c">•  Đặt hàng, theo dõi và đánh giá hợp lệ</text>
<rect x="1480" y="640" width="650" height="266" rx="22" fill="#edf6f7" stroke="#2c7882" stroke-width="2"/>
<text x="1510" y="687.12" font-family="Arial" font-size="24" font-weight="700" text-anchor="start" fill="#2c7882">05</text>
<text x="1562" y="692.8" font-family="Arial" font-size="35" font-weight="700" text-anchor="start" fill="#19372d">Kết nối đúng nhu cầu</text>
<text x="1512" y="764.64" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#42524c">•  Gợi ý nội dung theo bộ lọc và vị trí</text>
<text x="1512" y="810.64" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#42524c">•  Bản đồ điểm cố định và điểm di động</text>
<text x="1512" y="856.64" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#42524c">•  Chiến dịch gắn với nguồn hàng thực tế</text>
<rect x="1480" y="1020" width="650" height="266" rx="22" fill="#f7f1ee" stroke="#8a6657" stroke-width="2"/>
<text x="1510" y="1067.12" font-family="Arial" font-size="24" font-weight="700" text-anchor="start" fill="#8a6657">06</text>
<text x="1562" y="1072.8" font-family="Arial" font-size="35" font-weight="700" text-anchor="start" fill="#19372d">Hoàn tất giao dịch</text>
<text x="1512" y="1144.64" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#42524c">•  Kiểm tra lại giá và tồn khi checkout</text>
<text x="1512" y="1190.64" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#42524c">•  QR qua SePay hoặc thanh toán COD</text>
<text x="1512" y="1236.64" font-family="Arial" font-size="28" font-weight="400" text-anchor="start" fill="#42524c">•  Giao nhận và phản hồi sau mua</text>
<rect x="900" y="638" width="400" height="284" rx="40" fill="#245d3d" stroke="none" stroke-width="2"/>
